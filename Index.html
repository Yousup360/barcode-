<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Perfect Spaced Barcode Design</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <style>
        /* ১. ইউনিভার্সাল রিসেট */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #fff;
            font-family: Arial, sans-serif;
            width: 100%;
            overflow-x: hidden;
        }

        /* ২. ফুল স্ক্রিন ডিজাইন */
        .barcode-row {
            width: 100vw; 
            border-bottom: 1px solid #000;
            padding: 15px 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .shop-name {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .product-name {
            font-size: 12px;
            margin-bottom: 4px;
        }

        /* ৩. বারকোড এরিয়া */
        .barcode-svg-wrapper {
            width: 180px; 
            display: flex;
            justify-content: center;
        }

        svg {
            width: 100%;
            height: auto;
        }

        /* ৪. প্রাইসের আগে গ্যাপ বাড়ানো হয়েছে */
        .price {
            font-size: 13px;
            font-weight: bold;
            margin-top: 8px; /* এখানে গ্যাপ ৮ পিক্সেল করা হয়েছে, আপনি চাইলে কমাতে-বাড়াতে পারেন */
        }

        /* ৫. ইউনিভার্সাল প্রিন্ট সেটিংস */
        @media print {
            @page {
                margin: 0;
            }
            body {
                margin: 0;
            }
            .barcode-row {
                width: 100%;
                page-break-inside: avoid;
            }
            .no-print {
                display: none;
            }
        }

        .print-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 8px 15px;
            background: #000;
            color: #fff;
            border: none;
            cursor: pointer;
            z-index: 100;
        }
    </style>
</head>
<body>

    <button class="print-btn no-print" onclick="window.print()">Print Label</button>

    <div id="barcode-list">
        <div class="barcode-row">
            <div class="shop-name">Fashion Demo</div>
            <div class="product-name">Smart Kurti</div>
            <div class="barcode-svg-wrapper">
                <svg id="barcode-single"></svg>
            </div>
            <div class="price">Price 1,000.00 TK</div>
        </div>
    </div>

<script>
    // বারকোড নম্বর এবং জেনারেশন
    const productCode = "86511159"; 

    JsBarcode("#barcode-single", productCode, {
        format: "CODE128",
        displayValue: true,
        fontSize: 16,
        height: 45,
        width: 2,
        flat: true,
        margin: 0
    });
</script>

</body>
</html>

{{-- ১ থেকে ১০ পর্যন্ত লুপ চলবে --}}
@for ($i = 0; $i < $qty; $i++)
    <div class="barcode-row">
        <div class="shop-name">Fashion Demo</div>
        <div class="product-name">Smart Kurti</div>
        <div class="barcode-svg-wrapper">
            <svg class="barcode-item" data-code="86511159"></svg>
        </div>
        <div class="price">Price 1,000.00 TK</div>
    </div>
@endfor

<script>
    // লুপের পর সব বারকোড একসাথে জেনারেট করার জন্য
    document.querySelectorAll('.barcode-item').forEach(function(el) {
        JsBarcode(el, el.getAttribute('data-code'), {
            format: "CODE128",
            displayValue: true,
            fontSize: 16,
            height: 45,
            width: 2,
            flat: true,
            margin: 0
        });
    });
</script>
