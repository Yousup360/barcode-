<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Full Screen Barcode Design</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <style>
        /* ১. সব মার্জিন এবং প্যাডিং জিরো করা */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #fff;
            font-family: Arial, sans-serif;
            width: 100%;
        }

        /* ২. প্রতিটি রো ১০০% চওড়া */
        .barcode-row {
            width: 100vw; /* ভিউপোর্ট উইডথ ১০০% */
            border-bottom: 1.5px solid #000; /* স্ক্রিনশটের মতো কালো দাগ */
            padding: 15px 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .shop-name {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .product-name {
            font-size: 12px;
            margin-bottom: 5px;
        }

        /* ৩. বারকোড এরিয়া */
        .barcode-svg-wrapper {
            width: 180px; /* বারকোডের প্রস্থ */
        }

        svg {
            width: 100%;
            height: auto;
        }

        .price {
            font-size: 13px;
            font-weight: bold;
            margin-top: -2px;
        }

        /* ৪. প্রিন্ট সেটিংস (পুরো কাগজ জুড়ে পাওয়ার জন্য) */
        @media print {
            @page {
                margin: 0; /* কাগজের ধারের সাদা অংশ বাদ দিবে */
            }
            body {
                margin: 0;
            }
            .barcode-row {
                width: 100%;
                border-bottom: 1px solid #000;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>

<div id="barcode-list">
    </div>

<script>
    // আপনার ডাটা অ্যারে
    const products = [
        { shop: "Fashion Demo", name: "Smart Kurti", code: "86511159", price: "1,000.00" },
        { shop: "Fashion Demo", name: "Smart Kurti", code: "123456789", price: "1,200.00" },
        { shop: "Fashion Demo", name: "Smart Kurti", code: "86511159", price: "1,000.00" },
        { shop: "Fashion Demo", name: "Smart Kurti", code: "8651115920260312", price: "1,000.00" }
    ];

    const list = document.getElementById('barcode-list');

    // লুপ চালিয়ে রো তৈরি
    products.forEach((item, index) => {
        list.innerHTML += `
            <div class="barcode-row">
                <div class="shop-name">${item.shop}</div>
                <div class="product-name">${item.name}</div>
                <div class="barcode-svg-wrapper">
                    <svg id="code-${index}"></svg>
                </div>
                <div class="price">Price ${item.price} TK</div>
            </div>
        `;
    });

    // বারকোড রেন্ডার
    products.forEach((item, index) => {
        JsBarcode(`#code-${index}`, item.code, {
            format: "CODE128",
            displayValue: true,
            fontSize: 16,
            height: 45,
            width: 2,
            flat: true,
            margin: 0
        });
    });
</script>

</body>
</html>
