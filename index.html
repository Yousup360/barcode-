<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Barcode System</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #f5f5f5; font-family: Arial, sans-serif; }
        
        .page-wrapper {
            width: 1000px; /* আপনার স্ক্রিনশটের প্রস্থ অনুযায়ী */
            margin: 20px auto;
            background: #fff;
            border-top: 1px solid #ccc;
        }

        .barcode-item {
            border-bottom: 1px solid #ccc; /* স্ক্রিনশটের সেই হালকা দাগ */
            padding: 10px 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .shop-name { font-size: 14px; font-weight: bold; margin: 0; }
        .product-name { font-size: 12px; margin: 2px 0; }
        
        /* বারকোড ফিক্সড উইডথ কন্টেইনার */
        .barcode-box {
            width: 160px; /* সংখ্যা বাড়লেও এই সাইজেই থাকবে */
            height: 60px;
            display: flex;
            justify-content: center;
        }

        svg.barcode {
            max-width: 100%;
            height: auto;
        }

        .price { font-size: 13px; font-weight: bold; margin-top: -2px; }

        @media print {
            body { background: none; }
            .page-wrapper { width: 100%; margin: 0; border: none; }
        }
    </style>
</head>
<body>

<div id="barcode-list" class="page-wrapper">
    </div>

<script>
    // আপনার প্রোডাক্টের ডেটা অ্যারে (এখানে তথ্য পরিবর্তন বা যোগ করুন)
    const productData = [
        { shop: "Fashion Demo", name: "Smart Kurti", code: "86511159", price: "1,000.00" },
        { shop: "Fashion Demo", name: "Modern Panjabi", code: "1234567890", price: "1,500.00" },
        { shop: "Fashion Demo", name: "Silk Sharee", code: "9876543210123", price: "5,500.00" },
        { shop: "Fashion Demo", name: "Kids T-Shirt", code: "5544332220260312", price: "450.00" }
    ];

    const container = document.getElementById('barcode-list');

    // লুপ চালিয়ে HTML তৈরি করা
    productData.forEach((item, index) => {
        const itemHTML = `
            <div class="barcode-item">
                <div class="shop-name">${item.shop}</div>
                <div class="product-name">${item.name}</div>
                <div class="barcode-box">
                    <svg class="barcode" id="barcode-${index}"></svg>
                </div>
                <div class="price">Price ${item.price} TK</div>
            </div>
        `;
        container.innerHTML += itemHTML;
    });

    // সব আইটেম রেন্ডার হওয়ার পর বারকোড জেনারেট করা
    productData.forEach((item, index) => {
        JsBarcode(`#barcode-${index}`, item.code, {
            format: "CODE128",
            displayValue: true,
            fontSize: 14,
            height: 40,
            width: 2,
            flat: true, // সংখ্যা বাড়লে বারকোডকে সংকুচিত করে ফিক্সড জায়গায় রাখবে
            margin: 0
        });
    });
</script>

</body>
</html>
