<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exact Barcode Design</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            font-family: 'Arial', sans-serif;
        }

        /* মেইন কন্টেইনার */
        .page-wrapper {
            width: 1000px; /* স্ক্রিনশটের চওড়া অনুপাত অনুযায়ী */
            margin: 20px auto;
            background: #fff;
        }

        /* প্রতিটি রো-এর ডিজাইন */
        .barcode-item {
            border-bottom: 1px solid #ccc; /* স্ক্রিনশটের হালকা বর্ডার */
            padding: 8px 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .shop-name {
            font-size: 14px;
            font-weight: bold;
            margin: 0;
            color: #000;
        }

        .product-name {
            font-size: 12px;
            margin: 1px 0;
            color: #000;
        }

        /* বারকোডের আসল লুক */
        svg.barcode {
            width: 130px; 
            height: 50px;
            margin: 2px 0;
        }

        .price {
            font-size: 13px;
            font-weight: 500;
            color: #000;
            margin-top: -2px;
        }

        /* প্রিন্ট সেটআপ */
        @media print {
            body { background: none; }
            .page-wrapper { width: 100%; margin: 0; border: none; }
            .barcode-item { border-bottom: 1px solid #000; }
        }
    </style>
</head>
<body>

<div class="page-wrapper">
    <div class="barcode-item">
        <div class="shop-name">Fashion Demo</div>
        <div class="product-name">Smart Kurti</div>
        <svg class="barcode" jsbarcode-value="86511159"></svg>
        <div class="price">Price 1,000.00 TK</div>
    </div>

    <div class="barcode-item">
        <div class="shop-name">Fashion Demo</div>
        <div class="product-name">Smart Kurti</div>
        <svg class="barcode" jsbarcode-value="86511159"></svg>
        <div class="price">Price 1,000.00 TK</div>
    </div>

    <div class="barcode-item">
        <div class="shop-name">Fashion Demo</div>
        <div class="product-name">Smart Kurti</div>
        <svg class="barcode" jsbarcode-value="86511159"></svg>
        <div class="price">Price 1,000.00 TK</div>
    </div>
</div>

<script>
    // বারকোডগুলো জেনারেট করার ফাংশন
    JsBarcode(".barcode").options({
        format: "CODE128",
        displayValue: true, // বারকোডের নিচে নাম্বার দেখাবে
        fontSize: 12,
        height: 35,
        width: 1.5,
        margin: 0
    }).init();
</script>

</body>
</html>
