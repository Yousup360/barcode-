<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Perfect Barcode Print System</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <style>
        /* পুরো পেজের সেটআপ */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
        }

        /* মেইন কন্টেইনার যা পুরো স্ক্রিন বা পেজ কভার করবে */
        .barcode-container {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        /* প্রতিটি রো-এর নিখুঁত ডিজাইন */
        .barcode-row {
            width: 100%;
            border-bottom: 1.5px solid #000; /* কাটার জন্য গাঢ় কালো লাইন */
            padding: 10px 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            page-break-inside: avoid; /* প্রিন্টের সময় যেন রো ভেঙে না যায় */
        }

        .shop-name {
            font-size: 14px;
            font-weight: bold;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .product-name {
            font-size: 12px;
            margin: 2px 0;
            font-weight: 500;
        }

        /* বারকোড বক্স - সংখ্যা বাড়লেও এটি ডিজাইন ভাঙবে না */
        .barcode-svg-wrapper {
            width: 180px; /* আপনার স্ক্রিনশটের অনুপাত অনুযায়ী */
            height: auto;
            margin: 2px 0;
        }

        svg {
            width: 100%;
            height: auto;
        }

        .price {
            font-size: 13px;
            font-weight: bold;
            margin-top: -2px;
        }

        /* প্রিন্টিং অপশন */
        @media print {
            @page {
                margin: 0; /* প্রিন্টারে এক্সট্রা মার্জিন বন্ধ করবে */
            }
            body {
                margin: 0;
            }
            .barcode-row {
                border-bottom: 1px solid #000;
            }
        }
    </style>
</head>
<body>

<div id="labels-wrapper" class="barcode-container">
    </div>

<script>
    // আপনার প্রোডাক্ট ডেটা অ্যারে (এখানে তথ্য যোগ করলে অটোমেটিক রো তৈরি হবে)
    const products = [
        { shop: "Fashion Demo", name: "Smart Kurti", code: "86511159", price: "1,000.00" },
        { shop: "Fashion Demo", name: "Smart Kurti", code: "1234567890", price: "1,200.00" },
        { shop: "Fashion Demo", name: "Smart Kurti", code: "99887766554433", price: "1,500.00" },
        { shop: "Fashion Demo", name: "Smart Kurti", code: "11223344", price: "800.00" }
    ];

    const wrapper = document.getElementById('labels-wrapper');

    // লুপ চালিয়ে HTML তৈরি
    products.forEach((item, index) => {
        const rowHTML = `
            <div class="barcode-row">
                <div class="shop-name">${item.shop}</div>
                <div class="product-name">${item.name}</div>
                <div class="barcode-svg-wrapper">
                    <svg id="barcode-${index}"></svg>
                </div>
                <div class="price">Price ${item.price} TK</div>
            </div>
        `;
        wrapper.innerHTML += rowHTML;
    });

    // সব ডাটার জন্য বারকোড রেন্ডার করা
    products.forEach((item, index) => {
        JsBarcode(`#barcode-${index}`, item.code, {
            format: "CODE128",
            displayValue: true,
            fontSize: 16,
            height: 45,
            width: 2,
            flat: true,  // সংখ্যা বাড়লে এটি বারকোডকে সংকুচিত করে ফিক্সড জায়গায় রাখবে
            margin: 0
        });
    });
</script>

</body>
</html>
