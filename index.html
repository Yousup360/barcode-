<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fixed Width Barcode System</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <style>
        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; background: #f0f0f0; }
        
        .label-wrapper {
            width: 500px; /* আপনার কার্ড বা রো এর ফিক্সড চওড়া */
            margin: 0 auto;
            background: #fff;
            border: 1px solid #ddd;
        }

        .barcode-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
            text-align: center;
        }

        /* বারকোড কন্টেইনারের সাইজ ফিক্সড রাখা */
        .barcode-container {
            width: 200px; /* বারকোডটি সর্বোচ্চ কতটুকু চওড়া হবে */
            margin: 0 auto;
        }

        svg {
            width: 100%; /* কন্টেইনার অনুযায়ী নিজেকে এডজাস্ট করবে */
            height: auto;
        }

        .info { font-size: 14px; margin-bottom: 5px; font-weight: bold; }
        .price { font-size: 13px; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

<div class="label-wrapper">
    <div class="barcode-item">
        <div class="info">Fashion Demo - 8 Digits</div>
        <div class="barcode-container">
            <svg class="barcode" jsbarcode-value="86511159"></svg>
        </div>
        <div class="price">Price 1,000.00 TK</div>
    </div>

    <div class="barcode-item">
        <div class="info">Fashion Demo - 15 Digits</div>
        <div class="barcode-container">
            <svg class="barcode" jsbarcode-value="123456789012345"></svg>
        </div>
        <div class="price">Price 1,200.00 TK</div>
    </div>
</div>

<script>
    // বারকোড রেন্ডার করার ফাংশন
    JsBarcode(".barcode").options({
        format: "CODE128",
        displayValue: true,
        fontSize: 14,
        height: 40,
        width: 2,      // বারের বেসিক পুরুত্ব
        flat: true,    // এটি বারকোডকে সুন্দরভাবে ফিট করতে সাহায্য করে
        margin: 0
    }).init();
</script>

</body>
</html>
